Identifier: eos45di
Slug: lazychemvis-enamine-hl
Status: Ready
Title: 2D projector trained on enamine hit locator
Description: Places a molecule on four precomputed two-dimensional maps of the Enamine
  Hit Locator Library, a diversity-selected catalogue of around 416,000 purchasable
  screening compounds. Only the PCA map, built on RDKit descriptors, is a true projection
  applied to new input. The UMAP and t-SNE landscapes were fitted on CLAMP and CheMeleon
  embeddings and are reproduced by XGBoost regressors over ECFP fingerprints, while
  a TMAP position is copied from the nearest library neighbour by Tanimoto search.
  Coordinates mean nothing outside this reference.
