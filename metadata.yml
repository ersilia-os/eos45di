Identifier: eos45di
Slug: lazychemvis-enamine-hl
Status: Ready
Title: 2D projector trained on enamine hit locator
Description: Maps a compound against the Enamine Hit Locator Library of around 416,000
  molecules, returning PCA, UMAP, t-SNE and TMAP coordinates derived from ECFP4 fingerprints
  and RDKit descriptors. This particular reference is a diversity-selected screening
  set, so a position indicates where a compound sits relative to chemistry that is
  readily purchasable rather than to bioactive space. Coordinates are only interpretable
  against this specific library.
