Identifier: eos45di
Slug: lazychemvis-enamine-hl
Status: Ready
Title: 2D projector trained on enamine hit locator
Description: This model uses lazy-chemvis tool to performs PCA, UMAP, t-SNE and 
  TMAP projections taking the Enamine Hit Locator library with 416K compounds as
  a chemical space of reference. ECFP4 fingerprints (2048 bits) and RDKit 
  physicochemical descriptors are used as molecular descriptors. Two coordinates
  are returned for each projection method.
